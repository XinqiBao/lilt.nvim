name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Neovim ${{ matrix.neovim }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # "default" uses the stable version owned by mise.toml.
        neovim: ["0.11.0", "default"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.9.18
          cache: false
      - name: Install test dependencies
        run: |
          mise exec -- python -m venv .venv
          .venv/bin/python -m pip install -r tests/requirements.txt
          .venv/bin/python -m pip freeze
      - name: Verify
        env:
          TEST_NEOVIM: ${{ matrix.neovim }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          tool=()
          if [ "$TEST_NEOVIM" != default ]; then
            mise install "aqua:neovim/neovim@$TEST_NEOVIM"
            tool=("aqua:neovim/neovim@$TEST_NEOVIM")
          fi
          mise exec "${tool[@]}" -- .venv/bin/python tests/run.py
